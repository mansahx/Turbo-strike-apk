name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web
        run: |
          if [ -f "Turbo Strike.html" ]; then
            mkdir -p www
            cp "Turbo Strike.html" www/index.html
            if [ -d "js" ]; then
              rm -rf www/js
              cp -r js www/js
            fi
          fi

      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          bash scripts/patch-android.sh

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TurboStrike.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboStrike-apk
          path: TurboStrike.apk

      - name: Publish GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TurboStrike.apk
          generate_release_notes: true

